name: CI - Build e testes
on:
  push:
    branches: [main, feat/solicitacoes-escolares]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    name: Build e testes Django
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-only-disposable-key-not-for-production
      DJANGO_DEBUG: "1"
      USE_SQLITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Build - compilar e verificar Django
        run: |
          python -m compileall -q config solicitacoes
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Testes automatizados e cobertura
        run: |
          python -m coverage run manage.py test --verbosity 2
          python -m coverage report --fail-under=90
